<!DOCTYPE html> 
<html lang="es"> 
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Login</title>
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318181b'/><text x='50' y='72' font-family='system-ui, sans-serif' font-size='65' font-weight='bold' fill='%23ffffff' text-anchor='middle'>E</text></svg>">
        <link rel="stylesheet" href="../css/estilos.css">
        <link rel="stylesheet" href="../css/componentes.css">
    </head>
    <body>
        <main>
            <div class="hero">
                <h1>¡Bienvenido!</h1>
                <p class="p-suave" id="frase-motivadora">Nunca es tarde para proponerse un cambio!</p>
                <h2>Login</h2>

                <div class="tarjeta-formulario-login">
                    <div class="row">
                        <label for="input-nombre-usuario">Nombre de usuario
                            <input id="input-nombre-usuario" type="text" placeholder="Ej. Alain" maxlength="20" required>
                        </label>
                    </div>

                    <div class="row">
                        <label for="input-contrasena-usuario">Contraseña
                            <input id="input-contrasena-usuario" type="password" maxlength="64" required>
                        </label>
                    </div>

                    <button type="submit" class="btn2" id="btn-iniciar-sesion">
                        Iniciar sesión
                    </button>

                    <button type="button" class="btn2" id="btn-registrarse">
                        Registrarse
                    </button>
                    
                    <p id="mensaje-error" class="texto-error" role="alert"></p>
                </div>

            </div>
        </main>

        <script type="module" src="../scripts/login.js"></script>
    </body>
</html>
